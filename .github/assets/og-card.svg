<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#161b3a"/>
      <stop offset="100%" stop-color="#1a0f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid texture -->
  <g stroke="#1f2937" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Brand strip -->
  <rect x="80" y="80" width="80" height="4" fill="url(#brand)" rx="2"/>
  <text x="80" y="120" fill="#a1a1aa" font-size="18" letter-spacing="3" font-weight="600">THINKING-LOOP</text>

  <!-- Headline -->
  <text x="80" y="200" fill="#fafafa" font-size="58" font-weight="800" font-family="Inter, system-ui, sans-serif">Test-time reasoning</text>
  <text x="80" y="262" fill="#fafafa" font-size="58" font-weight="800" font-family="Inter, system-ui, sans-serif">compute that ships.</text>

  <!-- Subheadline -->
  <text x="80" y="320" fill="#a1a1aa" font-size="22" font-family="Inter, system-ui, sans-serif">5 published strategies behind one Python interface,</text>
  <text x="80" y="350" fill="#a1a1aa" font-size="22" font-family="Inter, system-ui, sans-serif">adjudicated by a critic LLM with calibrated confidence.</text>

  <!-- Big numbers -->
  <g transform="translate(80, 410)">
    <!-- 92.5% -->
    <text x="0" y="60" fill="#86efac" font-size="64" font-weight="800">92.5%</text>
    <text x="0" y="90" fill="#71717a" font-size="14" letter-spacing="1">ACCURACY · 40-Q BENCHMARK</text>

    <!-- 3.7x cost -->
    <text x="280" y="60" fill="#c4b5fd" font-size="64" font-weight="800">3.7×</text>
    <text x="280" y="90" fill="#71717a" font-size="14" letter-spacing="1">COST vs DIRECT BASELINE</text>

    <!-- +25pp -->
    <text x="560" y="60" fill="#fda4af" font-size="64" font-weight="800">+25pp</text>
    <text x="560" y="90" fill="#71717a" font-size="14" letter-spacing="1">OVER NAÏVE LLM CALL</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="585" width="1200" height="45" fill="#0a0e1a"/>
  <text x="80" y="612" fill="#a1a1aa" font-size="16" font-family="Inter, system-ui, sans-serif">github.com/darrshangovender/thinking-loop</text>
  <text x="1120" y="612" fill="#71717a" font-size="14" text-anchor="end" font-family="Inter, system-ui, sans-serif">MIT · Python 3.11+ · Anthropic + OpenAI</text>

  <!-- Decorative — tiny "code" element top right -->
  <g transform="translate(880, 110)" font-size="13" fill="#a78bfa">
    <text y="0">from thinking_loop import ThinkingLoop</text>
    <text y="20" fill="#71717a"># 5 strategies, 1 interface</text>
    <text y="40" fill="#86efac">answer = loop.solve(hard_question)</text>
    <text y="60" fill="#71717a"># → calibrated confidence + trace</text>
  </g>
</svg>