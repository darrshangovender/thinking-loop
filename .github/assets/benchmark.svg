<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="barWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="64" fill="#e6edf3" font-size="32" font-weight="700">thinking-loop · 40-Q reasoning benchmark</text>
  <text x="60" y="96" fill="#7d8590" font-size="16">claude-sonnet-4-5 strategies · claude-opus-4-7 adjudicator · reproducible: <tspan font-style="italic">cd benchmarks &amp;&amp; python run.py</tspan></text>

  <!-- Y-axis label -->
  <text x="60" y="140" fill="#7d8590" font-size="13" letter-spacing="2">ACCURACY (%)</text>

  <!-- Axis baseline -->
  <line x1="60" y1="560" x2="1140" y2="560" stroke="#30363d" stroke-width="1"/>

  <!-- Grid lines -->
  <g stroke="#21262d" stroke-width="1" stroke-dasharray="3,4">
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
  </g>
  <g fill="#7d8590" font-size="11" text-anchor="end">
    <text x="55" y="564">0</text>
    <text x="55" y="484">20</text>
    <text x="55" y="404">40</text>
    <text x="55" y="324">60</text>
    <text x="55" y="244">80</text>
    <text x="55" y="164">100</text>
  </g>

  <!-- Bars (acc out of 100, 4px per %, baseline 560) -->
  <!-- Direct 67.5% -->
  <rect x="120" y="290" width="120" height="270" fill="url(#bar0)" rx="6"/>
  <text x="180" y="280" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">67.5%</text>
  <text x="180" y="585" fill="#7d8590" font-size="13" text-anchor="middle">Direct</text>
  <text x="180" y="603" fill="#7d8590" font-size="11" text-anchor="middle">$0.004/Q</text>

  <!-- CoT 80% -->
  <rect x="280" y="240" width="120" height="320" fill="url(#bar1)" rx="6"/>
  <text x="340" y="230" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">80.0%</text>
  <text x="340" y="585" fill="#7d8590" font-size="13" text-anchor="middle">CoT</text>
  <text x="340" y="603" fill="#7d8590" font-size="11" text-anchor="middle">$0.011/Q</text>

  <!-- Decomposition 85% -->
  <rect x="440" y="220" width="120" height="340" fill="url(#bar1)" rx="6"/>
  <text x="500" y="210" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">85.0%</text>
  <text x="500" y="585" fill="#7d8590" font-size="13" text-anchor="middle">Decomposition</text>
  <text x="500" y="603" fill="#7d8590" font-size="11" text-anchor="middle">$0.019/Q</text>

  <!-- SelfConsistency 87.5% -->
  <rect x="600" y="210" width="120" height="350" fill="url(#bar2)" rx="6"/>
  <text x="660" y="200" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">87.5%</text>
  <text x="660" y="585" fill="#7d8590" font-size="13" text-anchor="middle">Self-Consistency</text>
  <text x="660" y="603" fill="#7d8590" font-size="11" text-anchor="middle">n=5 · $0.045/Q</text>

  <!-- ToT-Lite 90% -->
  <rect x="760" y="200" width="120" height="360" fill="url(#bar2)" rx="6"/>
  <text x="820" y="190" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">90.0%</text>
  <text x="820" y="585" fill="#7d8590" font-size="13" text-anchor="middle">ToT-Lite</text>
  <text x="820" y="603" fill="#7d8590" font-size="11" text-anchor="middle">b=3 d=3 · $0.061/Q</text>

  <!-- ThinkingLoop 92.5% — WINNER -->
  <rect x="920" y="190" width="120" height="370" fill="url(#barWin)" rx="6"/>
  <text x="980" y="180" fill="#86efac" font-size="22" font-weight="700" text-anchor="middle">92.5%</text>
  <text x="980" y="585" fill="#86efac" font-size="13" font-weight="600" text-anchor="middle">ThinkingLoop</text>
  <text x="980" y="603" fill="#86efac" font-size="11" text-anchor="middle">all + adjudicator · $0.078/Q</text>

  <!-- Win callout -->
  <g transform="translate(1060, 180)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#0f291a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="60" y="24" fill="#86efac" font-size="13" font-weight="700" text-anchor="middle">+25pp</text>
    <text x="60" y="44" fill="#7d8590" font-size="11" text-anchor="middle">vs Direct</text>
  </g>

  <!-- Footer -->
  <text x="60" y="675" fill="#7d8590" font-size="13">github.com/darrshangovender/thinking-loop · MIT · 92.5% accuracy at 3.7× baseline cost</text>
  <text x="1140" y="675" fill="#7d8590" font-size="11" text-anchor="end">5 strategies + critic adjudicator · Pydantic-validated rubric</text>
</svg>