[project]
name = "thinking-loop"
version = "0.1.0"
description = "Test-time reasoning compute. Five published strategies behind one interface, adjudicated by a critic LLM, with calibrated confidence and hard budget guards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["llm", "reasoning", "test-time-compute", "chain-of-thought", "self-consistency", "tree-of-thoughts", "agents"]
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    # benchmarks/run.py and the strategy fixtures load YAML question sets.
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/thinking-loop"
Issues = "https://github.com/darrshangovender/thinking-loop/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thinking_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E731 stays on so the deliberate `# noqa: E731` marker in adjudicator.py
# remains load-bearing rather than silently going stale.
extend-select = ["E731"]
